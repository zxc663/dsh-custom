<g class="ui"><text x="284" y="1000" class="muted tiny">V2 原型：产品主轴=目标上下文 × 有效配置版本 × 草案/发布/生效生命周期</text><text x="284" y="1024" class="muted tiny">能力标签是产品契约，不是装饰：蓝=已有/历史实证，黄=未实现，红=规划中。所有未完成能力必须显式显示。</text><text x="284" y="1064" class="muted tiny">当前实现/历史证据不会被当作 live 完成；settings.section live occupant 已由 Inspect 确认，GUI 视觉仍需实现后实机走查。</text></g>
